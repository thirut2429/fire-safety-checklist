<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <title>Fire Safety App</title>
  <!-- กำหนด Favicon (ไอคอนบนแท็บเบราว์เซอร์) เปลี่ยน URL รูปได้ถ้าต้องการ -->
  <link rel="icon" href="https://lh3.googleusercontent.com/d/11dylCDhtUDKKZsWAmB88QuKrIRVO-rJi" type="image/png">
  <style>
    /* ตั้งค่าให้ Iframe เต็มหน้าจอและไม่มีกรอบ */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden; /* ป้องกันการเกิด Scrollbar ซ้อนกัน */
      background-color: #F1F5F9;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <!-- นำลิงก์ Google Apps Script ของคุณมาใส่ที่ src -->
  <iframe src="https://script.google.com/macros/s/AKfycby61CqR6UpRAyKsnkgQm2_w-XxrUMMgEveGQA7BVuZ14eecnUj9RZCDYQrw9yK8RJ9v3w/exec" allow="camera"></iframe>
</body>
</html>
